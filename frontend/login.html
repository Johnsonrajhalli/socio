<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocioSphere — Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="centered-container">
        <section class="auth-container">
            
            <div class="hero" style="flex: 1; padding: 40px; max-width: 520px;">
                <div class="brand-logo" style="font-size: 22px; margin-bottom: 6px;">
                    <div class="logo-icon" style="width: 54px; height: 54px; font-size: 20px; border-radius: 10px;">SS</div>
                    <span>SOCIOSPHERE</span>
                </div>
                <p style="color: var(--muted); font-size: 14px; margin-top: -15px;">
                
                <div class="card" style="margin-top: 25px; padding: 28px; background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.8));">
                    <h2 style="margin: 0 0 8px 0; font-size: 20px;">Your social world — calm, focused, delightful</h2>
                    <p style="color: var(--muted); font-size: 14px; line-height: 1.5;">
                        Welcome to SocioSphere — a modern, light and fast social feed built for real conversations. 
                        
                    </p>
                </div>

                <div style="margin-top: 20px; font-size: 15px; text-align: center;">
                    New here? 
                    <a href="signup.html" style="font-weight: 600;">Create an account</a>
                </div>
            </div>

            <div class="card" style="width: 420px; max-width: 92%; padding: 40px 30px;">
                <h3 style="font-size: 22px; margin: 0 0 6px 0;">Welcome back</h3>
                <p class="subtitle" style="margin: 0 0 25px 0; color: var(--muted); font-size: 14px;">Sign in to continue to SocioSphere</p>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="email">Email or username</label>
                        <input id="email" name="email" type="text" placeholder="yourname@example.com" required />
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" placeholder="••••••••" required />
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px;">
                        <label style="display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; user-select: none;">
                            <input type="checkbox" style="width: 16px; height: 16px;" />
                            Remember me
                        </label>
                        <a href="#" style="font-weight: 600;">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary">Sign in</button>
                </form>

                <div style="text-align: center; margin-top: 25px; font-size: 13px; color: var(--muted);">
                    Don't have an account?
                    <a href="signup.html" style="font-weight: 600;">
                        Sign up
                    </a>
                </div>
            </div>

        </section>
    </div>

       <script>
async function handleLogin(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    try {
        const res = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok || !data.token) {
            alert(data.message || "Login failed");
            return;
        }

        // Save JWT token
        localStorage.setItem("token", data.token);

        // Decode user ID from token (optional: used in home feed)
        const payload = JSON.parse(atob(data.token.split('.')[1]));
        localStorage.setItem("userId", payload.id);

        // Redirect to home
        window.location.href = "index.html";

    } catch (err) {
        console.error("Login Error:", err);
        alert("Server error. Try again!");
    }
}

// Auto redirect if already logged in
(function () {
    if (localStorage.getItem("token")) {
        window.location.href = "index.html";
    }
})();
</script>


</body>
</html>
