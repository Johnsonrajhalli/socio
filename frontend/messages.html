<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocioSphere — Messages</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Specific layout for the Messages page */
        .messages-grid {
            display: grid;
            grid-template-columns: 320px 1fr; /* Conversation list | Chat window */
            max-width: 1200px;
            margin: 20px auto;
            /* Calculate height to fill the viewport minus header height */
            min-height: calc(100vh - 120px); 
            border-radius: var(--radius);
            overflow: hidden; 
            box-shadow: var(--shadow);
        }
        .conversation-list {
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            /* Ensures sidebar is tall enough */
            min-height: inherit; 
        }
        .chat-window {
            background: var(--card); /* Changed to card white for a cleaner look */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .conversation-item {
            padding: 15px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
        }
        .conversation-item:hover, .conversation-item.active {
            background: rgba(74, 138, 244, 0.08);
            border-left: 4px solid var(--primary);
            padding-left: 16px;
        }
        /* Message area styling */
        .message-content { 
            padding: 20px; 
            flex-grow: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column-reverse; /* Shows new messages at the bottom */
        }
        /* Style for incoming/outgoing bubbles */
        .message-bubble {
            max-width: 70%; 
            margin-bottom: 10px; 
            padding: 10px 15px; 
            border-radius: 18px; 
            font-size: 14px;
        }
        .incoming {
            background: var(--bg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .outgoing {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-input { 
            padding: 20px; 
            border-top: 1px solid var(--border); 
            background: var(--card); 
        }
        
        @media (max-width: 768px) {
            .messages-grid {
                grid-template-columns: 1fr;
            }
            .conversation-list {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>
    
    <header class="header">
        <a href="index.html" class="brand-logo">
            <div class="logo-icon">SS</div>
            <span>SocioSphere</span>
        </a>
        <div class="profile-menu" style="display: flex; align-items: center; gap: 15px;">
             <a href="index.html" class="sidebar-link" style="padding: 0; color: var(--muted);">Home</a>
            <div class="post-avatar" style="width: 40px; height: 40px; font-size: 16px;">JD</div>
            <a href="#" onclick="handleLogout(); return false;" class="sidebar-link link-logout" style="padding: 0; border-top: none; margin-top: 0;">Logout</a>
        </div>
    </header>

    <main class="messages-grid">
        <aside class="conversation-list">
            <h4 style="padding: 0 20px 10px 20px; margin-bottom: 10px; border-bottom: 1px solid var(--border); color: var(--text);">Direct Messages</h4>
            <div class="conversation-item active">
                <div class="post-avatar" style="width: 40px; height: 40px; font-size: 16px;">AL</div>
                <div>
                    <strong style="font-size: 15px;">Alice Lee</strong>
                    <p style="font-size: 13px; color: var(--muted); margin: 0;">Hey, check out the new design!</p>
                </div>
            </div>
            <div class="conversation-item">
                <div class="post-avatar" style="width: 40px; height: 40px; font-size: 16px; background: var(--secondary);">RG</div>
                <div>
                    <strong style="font-size: 15px;">Robert Green</strong>
                    <p style="font-size: 13px; color: var(--muted); margin: 0;">Need that PR merged ASAP.</p>
                </div>
            </div>
        </aside>

        <section class="chat-window">
            <div class="message-content">
                 <p class="message-bubble outgoing">That sounds great! I'll check it out now. Thanks!</p>
                <p class="message-bubble incoming">Hey, check out the new design! It's so much cleaner.</p>
                <p style="text-align: center; font-size: 12px; color: var(--muted); margin: 15px 0;">Yesterday</p>

            </div>

            <div class="message-input">
                <div style="display: flex; gap: 10px;">
                    <input type="text" placeholder="Type a message..." style="flex-grow: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border);">
                    <button class="btn btn-primary" style="width: auto; padding: 10px 20px;">Send</button>
                </div>
            </div>
        </section>
    </main>
    
    <script>
        // Redirect if not logged in
        (function(){
            if(!localStorage.getItem('socio_token')){
                window.location.href = 'login.html';
            }
        })();

        function handleLogout() {
            if (confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('socio_token');
                localStorage.removeItem('socio_user');
                window.location.href = 'login.html'; 
            }
        }
    </script>
</body>
</html>
