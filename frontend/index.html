<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocioSphere — Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header">
        <a href="index.html" class="brand-logo">
            <div class="logo-icon">SS</div>
            <span>SocioSphere</span>
        </a>

        <div class="profile-menu">
            <input type="text" placeholder="Search...">

            <!-- 🔥 Avatar Click Fix -->
            <div class="post-avatar" onclick="window.location.href='profile.html'" style="cursor:pointer;">
                <img id="headerAvatarImg" src="" alt="Avatar">
                <span id="headerAvatarInitials">JD</span>
            </div>

            <a href="#" onclick="handleLogout(); return false;" class="sidebar-link link-logout">Logout</a>
        </div>
    </header>

    <main class="main-grid">

        <aside class="sidebar">
            <a href="index.html" class="sidebar-link active">🏠 Dashboard</a>
            <a href="profile.html" class="sidebar-link">👤 My Profile</a>
            <a href="messages.html" class="sidebar-link">💬 Messages</a>
            <a href="friends.html" class="sidebar-link">👥 Friends</a>
            <a href="settings.html" class="sidebar-link">⚙ Settings</a>
            <a href="#" onclick="handleLogout(); return false;" class="sidebar-link link-logout">❌ Log Out</a>
        </aside>

        <section class="feed-area">

            <div class="card create-post-card">
                <p>What's on your mind?</p>
                <div class="input-group">
                    <textarea id="postContent" placeholder="Share a thought, photo, or achievement..."></textarea>
                    <button id="postButton" class="btn btn-primary">Post to Sphere</button>
                </div>
            </div>

            <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none" />

            <div id="previewModal" class="modal-hidden">
                <h3>Preview Your Post</h3>
                <div id="mediaPreview"></div>
                <textarea id="captionInput" placeholder="Add a caption (optional)"></textarea>
                <button id="confirmPost" class="btn btn-primary">Confirm Post</button>
            </div>

            <p id="status"></p>
        </section>

        <aside class="widgets-area">
            <div class="card widget-card">
                <h4>Suggested Friends</h4>
                <div><strong>Tom H.</strong><p>3 mutual connections</p></div>
                <div><strong>Sarah J.</strong><p>Followed by Alice Lee</p></div>
            </div>
        </aside>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
